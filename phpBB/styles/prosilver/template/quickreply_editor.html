<script>
// <![CDATA[

/*
 * Enhanced Quick Reply System
 * Features:
 * 1. Smooth scroll
 * 2. Center textarea on screen
 * 3. Scroll only if off-screen
 * 4. Floating close button
 * IM3/phpBB 3.0.15 compatible
 */

function qr_smoothScroll(targetY)
{
	var startY = window.pageYOffset || document.documentElement.scrollTop;
	var distance = targetY - startY;
	var duration = 300; // ms
	var startTime = (new Date()).getTime();

	function animate()
	{
		var now = (new Date()).getTime();
		var elapsed = now - startTime;

		if (elapsed >= duration)
		{
			window.scrollTo(0, targetY);
			return;
		}

		// Ease-in-out cubic
		var t = elapsed / duration;
		var eased = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

		window.scrollTo(0, startY + distance * eased);
		setTimeout(animate, 10);
	}

	animate();
}

function qr_getOffsetTop(el)
{
	var y = 0;
	while (el)
	{
		y += el.offsetTop;
		el = el.offsetParent;
	}
	return y;
}

function hide_qr(show)
{
	dE('qr_editor_div');
	dE('qr_showeditor_div');

	if (show)
	{
		setTimeout(function() {

			var box = document.getElementById('message-box');
			if (!box) return;

			var boxY = qr_getOffsetTop(box);
			var boxHeight = box.offsetHeight;
			var viewportTop = window.pageYOffset || document.documentElement.scrollTop;
			var viewportBottom = viewportTop + window.innerHeight;

			// Center target position
			var targetY = boxY - (window.innerHeight / 2) + (boxHeight / 2);
			if (targetY < 0) targetY = 0;

			// Scroll only if off-screen
			if (boxY < viewportTop || boxY > viewportBottom)
			{
				qr_smoothScroll(targetY);
			}

			// Focus textarea
			var msg = document.getElementsByName('message')[0];
			if (msg) msg.focus();

		}, 20);
	}

	return true;
}

function qr_close()
{
	document.getElementById('qr_editor_div').style.display = 'none';
	document.getElementById('qr_showeditor_div').style.display = '';
}

function init_qr()
{
	dE('qr_showeditor_div');
	return true;
}

onload_functions.push('init_qr();');

// ]]>
</script>


<style>
/* Floating close button */
#qr_close_btn {
	position: absolute;
	top: 6px;
	right: 10px;
	cursor: pointer;
	font-weight: bold;
	font-size: 16px;
	color: #444;
	background: #eee;
	border: 1px solid #aaa;
	padding: 2px 6px;
	border-radius: 3px;
}
#qr_close_btn:hover {
	background: #ddd;
}
</style>

	<form method="post" action="{U_QR_ACTION}">

				<h2>{L_QUICKREPLY}</h2>

				<fieldset class="fields1">

						<dt><label for="subject">{L_SUBJECT}:</label></dt>
						<dd><input type="text" name="subject" id="subject-ns" size="45" maxlength="64" tabindex="2" value="{SUBJECT}" class="inputbox autowidth" /></dd>
					</dl>

					<div id="message-box-ns">
						<textarea style="height: 9em;" name="message" rows="7" cols="76" tabindex="3" class="inputbox"></textarea>
					</div>
				</fieldset>

				<fieldset class="submit-buttons">
					{S_FORM_TOKEN}
					{QR_HIDDEN_FIELDS}
					<input type="submit" accesskey="s" tabindex="6" name="post" value="{L_SUBMIT}" class="button1" />&nbsp;
					<input type="submit" accesskey="f" tabindex="7" name="full_editor" value="{L_FULL_EDITOR}" class="button2" />&nbsp;
				</fieldset>

			<span class="corners-bottom"><span></span></span></div>
		</div>
	</form>
</noscript>


<form method="post" action="{U_QR_ACTION}">
	<div class="panel" style="display: none; position: relative;" id="qr_editor_div">
		<div id="qr_close_btn" onclick="qr_close();">X</div>

		<div class="inner"><span class="corners-top"><span></span></span>

			<h2>{L_QUICKREPLY}</h2>

			<fieldset class="fields1">
				<dl style="clear: left;">
					<dt><label for="subject">{L_SUBJECT}:</label></dt>
					<dd><input type="text" name="subject" id="subject" size="45" maxlength="64" tabindex="2" value="{SUBJECT}" class="inputbox autowidth" /></dd>
				</dl>

				<div id="message-box">
					<textarea style="height: 9em;" name="message" rows="7" cols="76" tabindex="3" class="inputbox"></textarea>
				</div>
			</fieldset>

			<fieldset class="submit-buttons">
				{S_FORM_TOKEN}
				{QR_HIDDEN_FIELDS}

				<input type="submit" accesskey="s" tabindex="6" name="post" value="{L_SUBMIT}" class="button1" />&nbsp;
				<input type="submit" accesskey="f" tabindex="7" name="full_editor" value="{L_FULL_EDITOR}" class="button2" />&nbsp;

				<!-- Backup close button -->
				<input type="button" class="button2" value="Close" onclick="qr_close();" />
			</fieldset>

		<span class="corners-bottom"><span></span></span></div>
	</div>
</form>

</div>
